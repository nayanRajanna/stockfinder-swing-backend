services:
  - type: web
    name: stockfinder-swing-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROWW_API_KEY
        sync: false
      - key: GROWW_API_SECRET
        sync: false
      - key: GROWW_ACCESS_TOKEN
        sync: false
      - key: GROWW_TOKEN_EXPIRY
        sync: false
